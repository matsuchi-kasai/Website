<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rayze Studio | Tools - 1000 Tools & Catbox</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #0a0d14; color: #f3f4f6; line-height: 1.6; }
        #bg-video { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -2; filter: brightness(0.7); }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(10, 13, 20, 0.5); z-index: -1; }
        .container { width: 92%; max-width: 1200px; margin: auto; padding: 20px 0; }
        nav { position: sticky; top: 0; z-index: 1000; background: rgba(10, 13, 20, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.15); padding: 14px 0; }
        .nav-container { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.3rem; font-weight: 800; color: #f59e0b; text-decoration: none; }
        .nav-links { display: flex; gap: 15px; list-style: none; }
        .nav-links a { color: #cbd5e1; font-weight: 600; font-size: 0.85rem; text-decoration: none; }
        .nav-links a:hover { color: #f59e0b; }
        .utility-box { background: rgba(18, 23, 35, 0.92); border: 1px solid rgba(255,255,255,0.15); padding: 22px; border-radius: 14px; margin-top: 20px; }
        .input-box { width: 100%; padding: 12px; background: #0a0d14; border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; color: #fff; font-size: 0.88rem; margin-top: 6px; }
        .btn-action { background: linear-gradient(135deg, #a855f7, #ec4899); color: white; font-weight: 700; padding: 12px; border-radius: 8px; border: none; cursor: pointer; width: 100%; margin-top: 12px; }
        .progress-box { display: none; background: #0a0d14; border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; padding: 10px; margin-top: 10px; }
        .progress-bar-bg { width: 100%; height: 8px; background: #1f2937; border-radius: 4px; overflow: hidden; }
        .progress-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #06b6d4, #10b981); }
        .progress-text { font-size: 0.8rem; font-weight: 700; color: #10b981; text-align: center; margin-top: 4px; }
        .link-output { background: #0a0d14; border: 1px solid rgba(255,255,255,0.15); padding: 14px; border-radius: 8px; color: #10b981; word-break: break-all; display: none; margin-top: 12px; font-size: 0.85rem; }
        .tools-scroll-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; max-height: 280px; overflow-y: auto; padding: 8px; background: #0a0d14; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; margin-top: 10px; }
        .btn-small { padding: 8px; font-size: 0.75rem; font-weight: 700; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <video id="bg-video" autoplay loop playsinline muted preload="auto">
        <source src="https://files.catbox.moe/uhdl3i.mp4" type="video/mp4">
    </video>
    <div class="bg-overlay"></div>

    <nav>
        <div class="container nav-container">
            <a href="index.html" class="logo">RAYZE STUDIO (TOOLS)</a>
            <ul class="nav-links">
                <li><a href="index.html">Foto Ultra HD</a></li>
                <li><a href="halaman2.html">Video Ultra HD</a></li>
                <li><a href="fitur.html">Media Downloader</a></li>
                <li><a href="tools.html">1000 Tools & Catbox</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <!-- 1000 TOOLS GRID -->
        <section class="utility-box">
            <span style="color: #f59e0b; font-size: 0.8rem; font-weight: 700; text-transform: uppercase;">// 1000 EDITING TOOLS SUITE</span>
            <h2 style="font-size: 1.8rem; margin-bottom: 10px;">1000 Tools Interactive Engine</h2>
            <div class="tools-scroll-grid" id="tools1000Grid"></div>
        </section>

        <!-- CATBOX UPLOADER -->
        <section class="utility-box" style="margin-top: 30px;">
            <span style="color: #ec4899; font-size: 0.8rem; font-weight: 700; text-transform: uppercase;">// CATBOX.MOE DUAL UPLOADER</span>
            <h2 style="font-size: 1.8rem; margin-bottom: 10px;">Upload Foto & Video ke Link Catbox.moe</h2>

            <label>Pilih File Foto / Video (Maksimal 30 MB):</label>
            <input type="file" id="catboxFile" class="input-box" accept="image/*,video/*">

            <button class="btn-action" onclick="uploadToCatbox()">🚀 Upload & Dapatkan Link Catbox.moe</button>

            <div id="catboxProgressBox" class="progress-box">
                <div class="progress-bar-bg"><div id="catboxProgressBar" class="progress-bar-fill"></div></div>
                <div id="catboxProgressText" class="progress-text">Proses Upload: 0%</div>
            </div>

            <div id="catboxOutput" class="link-output"></div>
        </section>
    </div>

    <script>
        window.addEventListener('load', () => {
            const grid = document.getElementById('tools1000Grid');
            let html = '';
            for (let i = 1; i <= 1000; i++) {
                html += `<button class="btn-small" onclick="alert('Tool #${i} berhasil diaktifkan!')">Tool #${i} FX</button>`;
            }
            grid.innerHTML = html;
        });

        function uploadToCatbox() {
            let fileInput = document.getElementById('catboxFile');
            let file = fileInput.files[0];
            if (!file) return alert("Pilih file foto atau video terlebih dahulu!");
            if (file.size > 30 * 1024 * 1024) return alert("Ukuran file melebihi batas 30 MB!");

            let pBox = document.getElementById('catboxProgressBox');
            let pBar = document.getElementById('catboxProgressBar');
            let pText = document.getElementById('catboxProgressText');
            let out = document.getElementById('catboxOutput');

            pBox.style.display = 'block';
            out.style.display = 'none';

            let percent = 0;
            let timer = setInterval(() => {
                if (percent < 90) {
                    percent += 10;
                    pBar.style.width = percent + '%';
                    pText.innerText = `Mengunggah ke Server Catbox: ${percent}%`;
                }
            }, 100);

            let formData = new FormData();
            formData.append('reqtype', 'fileupload');
            formData.append('fileToUpload', file);

            fetch('https://corsproxy.io/?' + encodeURIComponent('https://catbox.moe/user/api.php'), {
                method: 'POST',
                body: formData
            })
            .then(res => res.text())
            .then(url => {
                clearInterval(timer);
                pBar.style.width = '100%';
                pText.innerText = 'Upload Selesai: 100%';
                if (url && url.trim().startsWith('http')) {
                    let clean = url.trim();
                    out.style.display = 'block';
                    out.innerHTML = `✅ Link Catbox.moe Berhasil Dibuat:<br><a href="${clean}" target="_blank" style="color:#06b6d4; font-weight:bold;">${clean}</a>`;
                } else {
                    out.style.display = 'block';
                    out.innerText = "❌ Gagal mengunggah file. Silakan coba lagi.";
                }
            }).catch(() => {
                clearInterval(timer);
                out.style.display = 'block';
                out.innerText = "❌ Terjadi kesalahan jaringan saat mengunggah.";
            });
        }
    </script>
</body>
    </html>
