<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rayze Animation AI</title>
    <!-- Font Awesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* Background Image yang kamu request */
            background-image: url('https://files.catbox.moe/90stkq.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
        }

        /* Container Efek Glassmorphism */
        .container {
            background: rgba(10, 10, 10, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 40px 30px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin: 30px 0;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid #fff;
            object-fit: cover;
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        p {
            font-size: 14px;
            color: #d1d1d1;
            margin-bottom: 30px;
        }

        /* Styling Tombol Link */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 20px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            border-radius: 12px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border: 1px solid transparent;
        }

        .link-btn i {
            font-size: 20px;
            position: absolute;
            left: 20px;
        }

        /* Warna Custom Tiap Tombol */
        .btn-youtube {
            background-color: rgba(255, 0, 0, 0.8);
        }
        .btn-youtube:hover {
            background-color: #ff0000;
            transform: scale(1.03);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
        }

        .btn-tiktok {
            background-color: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255,255,255,0.3);
        }
        .btn-tiktok:hover {
            background-color: #000000;
            border-color: #00f2fe;
            transform: scale(1.03);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
        }

        .btn-wachannel {
            background-color: rgba(37, 211, 102, 0.8);
        }
        .btn-wachannel:hover {
            background-color: #25D366;
            transform: scale(1.03);
            box-shadow: 0 0 15px rgba(37, 211, 102, 0.6);
        }

        .btn-wacontact {
            background: linear-gradient(45deg, #128C7E, #25D366);
        }
        .btn-wacontact:hover {
            transform: scale(1.03);
            box-shadow: 0 0 15px rgba(37, 211, 102, 0.7);
        }

        /* Styling Spotify */
        .spotify-wrapper {
            margin-top: 35px;
            padding-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
        }

        .spotify-wrapper h2 {
            font-size: 16px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #1DB954;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Foto Profil (Sementara pakai inisial nama, bisa diganti dengan link foto logomu) -->
        <img src="https://ui-avatars.com/api/?name=Rayze+Animation+AI&background=random&color=fff&size=200" alt="Profile" class="profile-img">
        
        <h1>Rayze Animation AI</h1>
        <p>Welcome to my official links!</p>

        <!-- Kumpulan Link -->
        <div class="links-container">
            <!-- Link YouTube -->
            <a href="https://www.youtube.com/@RayzeAnimationAI" target="_blank" class="link-btn btn-youtube">
                <i class="fa-brands fa-youtube"></i> YouTube
            </a>

            <!-- Link TikTok -->
            <a href="https://www.tiktok.com/@rayze_animation_ai" target="_blank" class="link-btn btn-tiktok">
                <i class="fa-brands fa-tiktok"></i> TikTok
            </a>

            <!-- Link WA Channel -->
            <a href="https://whatsapp.com/channel/0029Vb8KFvB5K3zXkMDEiv1M" target="_blank" class="link-btn btn-wachannel">
                <i class="fa-brands fa-whatsapp"></i> WhatsApp Channel
            </a>

            <!-- Link Chat WA Langsung -->
            <a href="https://wa.me/6283152561195?text=Halo%20Rayze%20Animation%20AI,%20saya%20ingin%20bertanya" target="_blank" class="link-btn btn-wacontact">
                <i class="fa-solid fa-comment-dots"></i> Chat WhatsApp (Fast Respon)
            </a>
        </div>

        <!-- Tool / Widget Spotify -->
        <div class="spotify-wrapper">
            <h2><i class="fa-brands fa-spotify"></i> My Playlist</h2>
            <!-- Kode Embed Spotify -->
            <iframe style="border-radius:12px" 
                src="https://open.spotify.com/embed/playlist/37i9dQZF1DXcBWIGoYBM5M?utm_source=generator&theme=0" 
                width="100%" 
                height="152" 
                frameBorder="0" 
                allowfullscreen="" 
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
                loading="lazy">
            </iframe>
        </div>
    </div>

</body>
</html>
