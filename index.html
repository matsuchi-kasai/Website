<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rayze Studio | Page 1 - Foto Ultra HD Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #0a0d14; color: #f3f4f6; line-height: 1.6; }
        #bg-video { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -2; filter: brightness(0.7); }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(10, 13, 20, 0.5); z-index: -1; }
        .container { width: 92%; max-width: 1200px; margin: auto; padding: 20px 0; }
        nav { position: sticky; top: 0; z-index: 1000; background: rgba(10, 13, 20, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.15); padding: 14px 0; }
        .nav-container { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.3rem; font-weight: 800; color: #06b6d4; text-decoration: none; }
        .nav-links { display: flex; gap: 15px; list-style: none; }
        .nav-links a { color: #cbd5e1; font-weight: 600; font-size: 0.85rem; text-decoration: none; }
        .nav-links a:hover { color: #06b6d4; }
        .utility-box { background: rgba(18, 23, 35, 0.92); border: 1px solid rgba(255,255,255,0.15); padding: 22px; border-radius: 14px; margin-top: 20px; }
        .input-box { width: 100%; padding: 12px; background: #0a0d14; border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; color: #fff; font-size: 0.88rem; margin-top: 6px; }
        .btn-action { background: linear-gradient(135deg, #06b6d4, #3b82f6); color: white; font-weight: 700; padding: 12px; border-radius: 8px; border: none; cursor: pointer; width: 100%; margin-top: 12px; }
        .canvas-preview { max-width: 100%; height: auto; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); margin-top: 15px; }
        .progress-box { display: none; background: #0a0d14; border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; padding: 10px; margin-top: 10px; }
        .progress-bar-bg { width: 100%; height: 8px; background: #1f2937; border-radius: 4px; overflow: hidden; }
        .progress-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #06b6d4, #10b981); }
        .progress-text { font-size: 0.8rem; font-weight: 700; color: #10b981; text-align: center; margin-top: 4px; }
        .star-rating { display: flex; gap: 8px; font-size: 1.8rem; cursor: pointer; color: #4b5563; justify-content: center; margin: 10px 0; }
        .star-rating .star.active { color: #f59e0b; }
    </style>
</head>
<body>
    <video id="bg-video" autoplay loop playsinline muted preload="auto">
        <source src="https://files.catbox.moe/uhdl3i.mp4" type="video/mp4">
    </video>
    <div class="bg-overlay"></div>

    <nav>
        <div class="container nav-container">
            <a href="index.html" class="logo">RAYZE STUDIO (PAGE 1)</a>
            <ul class="nav-links">
                <li><a href="index.html">Foto Ultra HD</a></li>
                <li><a href="halaman2.html">Video Ultra HD</a></li>
                <li><a href="fitur.html">Media Downloader</a></li>
                <li><a href="tools.html">1000 Tools & Catbox</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <section class="utility-box">
            <span style="color: #06b6d4; font-size: 0.8rem; font-weight: 700; text-transform: uppercase;">// FOTO ULTRA HD PROCESSING</span>
            <h2 style="font-size: 1.8rem; margin-bottom: 10px;">300x Ultra HD Foto Processor</h2>
            
            <label>1. Masukkan File Foto:</label>
            <input type="file" id="photoInput" class="input-box" accept="image/*" onchange="loadPhoto(event)">

            <div style="text-align: center; display: none;" id="photoPrevBox">
                <canvas id="photoCanvas" class="canvas-preview"></canvas>
            </div>

            <div style="margin-top: 15px;">
                <label>2. Tingkat Ketajaman Foto (1x - 300x): <span id="photoSharpVal">15x</span></label>
                <input type="range" id="photoSharpRange" class="input-box" min="1" max="300" value="15" oninput="applyPhotoEffects()">
            </div>

            <button class="btn-action" onclick="exportPhotoHD()">📥 Render & Export Foto 300x Ultra HD</button>

            <div id="photoProgressBox" class="progress-box">
                <div class="progress-bar-bg"><div id="photoProgressBar" class="progress-bar-fill"></div></div>
                <div id="photoProgressText" class="progress-text">Rendering Foto: 0%</div>
            </div>
        </section>

        <!-- RATING & REVIEW FORM -->
        <section class="utility-box" style="max-width: 600px; margin: 30px auto;">
            <h3 style="text-align: center; margin-bottom: 10px;">Ulasan & Rating Studio (Halaman 1)</h3>
            <form onsubmit="submitRating(event)">
                <div style="text-align:center;">
                    <div class="star-rating" id="starBox">
                        <span class="star" onclick="setStar(1)">★</span>
                        <span class="star" onclick="setStar(2)">★</span>
                        <span class="star" onclick="setStar(3)">★</span>
                        <span class="star" onclick="setStar(4)">★</span>
                        <span class="star active" onclick="setStar(5)">★</span>
                    </div>
                    <input type="hidden" id="starVal" value="5">
                </div>
                <input type="text" class="input-box" required placeholder="Nama Anda...">
                <textarea class="input-box" rows="3" required placeholder="Pesan ulasan Anda..." style="margin-top:10px;"></textarea>
                <button type="submit" class="btn-action" style="background: linear-gradient(135deg, #f59e0b, #d97706);">⭐ Kirim Ulasan</button>
            </form>
        </section>
    </div>

    <script>
        let rawImage = null;
        const photoCanvas = document.getElementById('photoCanvas');
        const pCtx = photoCanvas.getContext('2d');

        function loadPhoto(e) {
            let file = e.target.files[0];
            if (file) {
                document.getElementById('photoPrevBox').style.display = 'block';
                let reader = new FileReader();
                reader.onload = (event) => {
                    rawImage = new Image();
                    rawImage.onload = () => {
                        photoCanvas.width = rawImage.width / 2;
                        photoCanvas.height = rawImage.height / 2;
                        applyPhotoEffects();
                    };
                    rawImage.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function applyPhotoEffects() {
            if (!rawImage) return;
            let sharp = document.getElementById('photoSharpRange').value;
            document.getElementById('photoSharpVal').innerText = sharp + 'x';
            pCtx.filter = `contrast(${100 + (sharp * 0.3)}%) saturate(${100 + (sharp * 0.2)}%) brightness(102%)`;
            pCtx.drawImage(rawImage, 0, 0, photoCanvas.width, photoCanvas.height);
        }

        function exportPhotoHD() {
            if (!rawImage) return alert("Upload foto terlebih dahulu!");
            let pBox = document.getElementById('photoProgressBox');
            let pBar = document.getElementById('photoProgressBar');
            let pText = document.getElementById('photoProgressText');
            pBox.style.display = 'block';

            let percent = 0;
            let timer = setInterval(() => {
                percent += 10;
                pBar.style.width = percent + '%';
                pText.innerText = `Render Foto HD: ${percent}%`;
                if (percent >= 100) {
                    clearInterval(timer);
                    let a = document.createElement('a');
                    a.href = photoCanvas.toDataURL();
                    a.download = "Rayze_Photo_UltraHD.png";
                    a.click();
                }
            }, 50);
        }

        function setStar(s) {
            document.getElementById('starVal').value = s;
            let stars = document.querySelectorAll('#starBox .star');
            stars.forEach((st, idx) => {
                if (idx < s) st.classList.add('active');
                else st.classList.remove('active');
            });
        }

        function submitRating(e) {
            e.preventDefault();
            alert(`Terima kasih! Review bintang ${document.getElementById('starVal').value} telah dikirim ke Rayze Studio.`);
        }
    </script>
</body>
                            </html>
