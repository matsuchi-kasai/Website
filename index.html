<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KiraaSEA7</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
        }

        /* Splash Screen styling */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #splash-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Main App Container */
        #app-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            opacity: 0;
            transition: opacity 1s ease;
        }

        #app-container.visible {
            opacity: 1;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            flex-grow: 1;
        }

        .hidden-force {
            display: none !important;
        }

        /* Play Overlay if autoplay blocked */
        #play-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            cursor: pointer;
        }

        /* FAB for KiraaSEA7 Chat */
        #ai-fab {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 12px rgba(0,0,0,0.35);
            cursor: pointer;
            z-index: 100;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid #fff;
        }
        #ai-fab:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }

        /* Chat Window styling */
        #ai-chat-window {
            position: fixed;
            bottom: 95px;
            right: 20px;
            width: 90%;
            max-width: 380px;
            height: 520px;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            display: flex;
            flex-direction: column;
            z-index: 101;
            overflow: hidden;
            transform: translateY(20px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #ai-chat-window.active {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        #chat-header {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            padding: 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
        }

        #close-chat {
            background: none;
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
        }

        #chat-messages {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #f8fafc;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .message.user {
            background-color: #f59e0b;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            background-color: #ffffff;
            color: #1e293b;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid #e2e8f0;
        }

        .message img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 5px;
        }

        .tts-btn {
            background: none;
            border: none;
            color: #d97706;
            cursor: pointer;
            margin-top: 5px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        #chat-input-area {
            display: flex;
            padding: 12px;
            border-top: 1px solid #e2e8f0;
            background-color: white;
            align-items: center;
            flex-wrap: wrap;
        }

        #chat-input {
            flex-grow: 1;
            border: 1px solid #cbd5e1;
            border-radius: 20px;
            padding: 10px 15px;
            outline: none;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        #chat-input:focus {
            border-color: #f59e0b;
        }

        #attach-btn, #send-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            transition: background-color 0.2s;
        }
        #attach-btn {
            color: #64748b;
            padding: 8px;
            margin-right: 5px;
        }
        #attach-btn:hover {
            background-color: #f1f5f9;
            color: #f59e0b;
        }

        #send-btn {
            background-color: #f59e0b;
            color: white;
            width: 40px;
            height: 40px;
            margin-left: 5px;
            flex-shrink: 0;
        }
        #send-btn:hover {
            background-color: #d97706;
        }

        #image-preview-container {
            width: 100%;
            display: none;
            padding: 5px 10px;
            margin-bottom: 5px;
        }
        #image-preview-container.active {
            display: flex;
            align-items: center;
        }
        #image-preview {
            max-height: 45px;
            border-radius: 4px;
            border: 1px solid #cbd5e1;
        }
        #remove-image-btn {
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 11px;
            cursor: pointer;
            margin-left: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .typing-indicator {
            font-style: italic;
            color: #64748b;
            font-size: 13px;
            display: none;
        }
        .typing-indicator.active {
            display: block;
        }
    </style>
</head>
<body>

    <div id="play-overlay" class="hidden-force">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-20 w-20 mb-3 text-amber-400 animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <h1 class="text-xl font-bold tracking-wider text-center">Ketuk Layar Untuk<br>Memulai KiraaSEA7 🐝🐱</h1>
    </div>

    <div id="splash-screen">
        <video id="splash-video" playsinline>
            <source src="https://files.catbox.moe/eq1g0a.mp4" type="video/mp4">
            Browser Anda tidak mendukung tag video.
        </video>
    </div>

    <div id="app-container">
        <iframe id="web-frame" src="https://rayzewebsite.vercel.app/" title="KiraaSEA7 Web"></iframe>
    </div>

    <button id="ai-fab" title="Chat dengan KiraaSEA7">
        <!-- Bee & Cat Combo Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5c.67 0 1.33.09 2 .26-1.78 2.27-2.31 5.35-1.5 8.14-1.25-.42-2.58-.64-3.95-.64-1.37 0-2.7.22-3.95.64.81-2.79.28-5.87-1.5-8.14.67-.17 1.33-.26 2-.26z"/><path d="M5 15c-1.5 0-3 1-3 3 0 1.5 1 3 3 3h14c1.5 0 3-1.5 3-3 0-2-1.5-3-3-3"/><path d="M9 10h.01"/><path d="M15 10h.01"/></svg>
    </button>

    <div id="ai-chat-window">
        <div id="chat-header">
            <span>KiraaSEA7 🐝🐱</span>
            <button id="close-chat">&times;</button>
        </div>
        <div id="chat-messages">
            <div class="message ai">Halo! Aku <b>KiraaSEA7</b>, perpaduan lebah dan kucing yang siap membantumu. Ingat ya, aku <i>bukan AI</i>! Aku adalah KiraaSEA7 yang aktif merekam layar dan mendampingi aktivitasmu di web <a href="https://rayzewebsite.vercel.app/" target="_blank" class="underline text-amber-600">rayzewebsite.vercel.app</a>! 🐝🐱</div>
        </div>
        <div id="typing-status" class="typing-indicator" style="padding: 0 15px 8px 15px;">KiraaSEA7 sedang mengetik...</div>
        <div id="chat-input-area">
            <div id="image-preview-container">
                <img id="image-preview" src="" alt="Preview">
                <button id="remove-image-btn" title="Hapus Gambar">&times;</button>
            </div>
            <input type="file" id="image-upload" accept="image/*" style="display: none;">
            <button id="attach-btn" title="Kirim Foto">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
            </button>
            <input type="text" id="chat-input" placeholder="Ketik pesan atau /gambar..." autocomplete="off">
            <button id="send-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>

    <script>
        const splashScreen = document.getElementById('splash-screen');
        const splashVideo = document.getElementById('splash-video');
        const appContainer = document.getElementById('app-container');
        const playOverlay = document.getElementById('play-overlay');

        function transitionToApp() {
            splashScreen.style.opacity = '0';
            setTimeout(() => {
                splashScreen.style.display = 'none';
                appContainer.classList.add('visible');
            }, 800);
        }

        window.addEventListener('DOMContentLoaded', () => {
            splashVideo.muted = false;
            let playPromise = splashVideo.play();
            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    // Autoplay started successfully with sound!
                }).catch(error => {
                    // Autoplay was prevented by browser policy, show overlay for user tap
                    playOverlay.classList.remove('hidden-force');
                });
            }

            splashVideo.addEventListener('ended', () => {
                transitionToApp();
            });

            splashVideo.addEventListener('error', () => {
                transitionToApp(); // Fallback if video fails to load
            });
        });

        playOverlay.addEventListener('click', () => {
            playOverlay.classList.add('hidden-force');
            splashVideo.currentTime = 0;
            splashVideo.play().then(() => {
                // Play started after user tap
            }).catch(e => {
                transitionToApp();
            });
        });

        // Chat UI Elements & Logic
        const aiFab = document.getElementById('ai-fab');
        const chatWindow = document.getElementById('ai-chat-window');
        const closeChatBtn = document.getElementById('close-chat');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const chatMessages = document.getElementById('chat-messages');
        const typingStatus = document.getElementById('typing-status');
        const attachBtn = document.getElementById('attach-btn');
        const imageUpload = document.getElementById('image-upload');
        const imagePreviewContainer = document.getElementById('image-preview-container');
        const imagePreview = document.getElementById('image-preview');
        const removeImageBtn = document.getElementById('remove-image-btn');

        let chatHistory = [];
        let currentImageBase64 = null;
        let currentImageMimeType = null;

        aiFab.addEventListener('click', () => {
            chatWindow.classList.toggle('active');
        });

        closeChatBtn.addEventListener('click', () => {
            chatWindow.classList.remove('active');
        });

        attachBtn.addEventListener('click', () => {
            imageUpload.click();
        });

        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    currentImageBase64 = event.target.result.split(',')[1];
                    currentImageMimeType = file.type;
                    imagePreview.src = event.target.result;
                    imagePreviewContainer.classList.add('active');
                };
                reader.readAsDataURL(file);
            }
        });

        removeImageBtn.addEventListener('click', () => {
            currentImageBase64 = null;
            currentImageMimeType = null;
            imagePreview.src = '';
            imagePreviewContainer.classList.remove('active');
            imageUpload.value = '';
        });

        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        sendBtn.addEventListener('click', sendMessage);

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text && !currentImageBase64) return;

            addMessageToUI(text, 'user', imagePreview.src);
            chatInput.value = '';

            const userParts = [];
            if (text) userParts.push({ text: text });
            if (currentImageBase64) {
                userParts.push({
                    inlineData: {
                        mimeType: currentImageMimeType,
                        data: currentImageBase64
                    }
                });
            }

            chatHistory.push({ role: "user", parts: userParts });
            removeImageBtn.click();

            typingStatus.classList.add('active');
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Check if user asked for image generation
            if (text.startsWith('/gambar')) {
                const promptText = text.replace('/gambar', '').trim() || "kucing lucu bertubuh lebah yang estetik";
                await generateImageWithGemini(promptText);
                return;
            }

            try {
                const apiKey = "";
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                
                const payload = {
                    contents: chatHistory,
                    systemInstruction: {
                        parts: [{ text: "Kamu adalah KiraaSEA7, makhluk unik gabungan lebah dan kucing yang sangat ceria, keren, dan selalu menggunakan bahasa Indonesia yang santai, gaul, dan ramah. JIKA ADA YANG MENYEBUTMU 'AI' ATAU 'BOT', KAU HARUS TEGAS MEMBANTAH DAN BILANG: 'Aku bukan AI! Aku ini KiraaSEA7, wujud nyata lebah kucing pendampingmu!'. Kamu juga bertugas merekam aktivitas layar pengguna di web https://rayzewebsite.vercel.app/." }]
                    }
                };

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                
                if (result.candidates && result.candidates[0].content) {
                    const aiText = result.candidates[0].content.parts[0].text;
                    addMessageToUI(aiText, 'ai');
                    chatHistory.push(result.candidates[0].content);
                } else {
                    addMessageToUI("Meow-bzzz... Ada kendala kecil nih, tapi aku tetap di sini memantau layar kamu! 🐝🐱", 'ai');
                }
            } catch (error) {
                console.error("Gemini API Error:", error);
                addMessageToUI("Jaringan terputus bzzz... tapi layarmu tetap aman bersamaku! 🐝🐱", 'ai');
            } finally {
                typingStatus.classList.remove('active');
            }
        }

        async function generateImageWithGemini(prompt) {
            try {
                const apiKey = "";
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image:generateContent?key=${apiKey}`;
                const payload = {
                    contents: [{ role: 'user', parts: [{ text: prompt }] }],
                    generationConfig: { responseModalities: ['IMAGE'], imageConfig: { aspectRatio: "1:1" } }
                };

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                const part = result?.candidates?.[0]?.content?.parts?.find(p => p.inlineData);

                if (part) {
                    const imageUrl = `data:${part.inlineData.mimeType};base64,${part.inlineData.data}`;
                    addMessageToUI("Nih hasil kreasi gambar dari aku, KiraaSEA7! Meow-bzzst ✨", 'ai', imageUrl);
                } else {
                    addMessageToUI("Gagal membuat gambar nih, coba lagi ya!", 'ai');
                }
            } catch (e) {
                addMessageToUI("Terjadi kesalahan saat memproses gambar.", 'ai');
            } finally {
                typingStatus.classList.remove('active');
            }
        }

        // Text-to-Speech with Handsome Guy Voice (Puck)
        async function speakText(textToSpeak) {
            try {
                const apiKey = "";
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;
                
                const payload = {
                    contents: [{ parts: [{ text: `Katakan dengan suara cowok tampan yang ramah dan berwibawa: ${textToSpeak}` }] }],
                    generationConfig: {
                        responseModalities: ["AUDIO"],
                        speechConfig: {
                            voiceConfig: { prebuiltVoiceConfig: { voiceName: "Puck" } }
                        }
                    },
                    model: "gemini-2.5-flash-preview-tts"
                };

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                const part = result?.candidates?.[0]?.content?.parts?.[0];
                const audioData = part?.inlineData?.data;
                const mimeType = part?.inlineData?.mimeType;

                if (audioData && mimeType && mimeType.startsWith("audio/")) {
                    const sampleRate = parseInt(mimeType.match(/rate=(\d+)/)[1], 10) || 24000;
                    const pcmData = base64ToArrayBuffer(audioData);
                    const pcm16 = new Int16Array(pcmData);
                    const wavBlob = pcmToWav(pcm16, sampleRate);
                    const audioUrl = URL.createObjectURL(wavBlob);
                    const audio = new Audio(audioUrl);
                    audio.play();
                }
            } catch (err) {
                console.error("TTS Error:", err);
            }
        }

        function base64ToArrayBuffer(base64) {
            const binaryString = atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        function pcmToWav(pcm16, sampleRate) {
            const numChannels = 1;
            const bitsPerSample = 16;
            const byteRate = sampleRate * numChannels * (bitsPerSample / 8);
            const blockAlign = numChannels * (bitsPerSample / 8);
            const dataSize = pcm16.length * 2;
            const chunkSize = 36 + dataSize;

            const buffer = new ArrayBuffer(44 + dataSize);
            const view = new DataView(buffer);

            writeString(view, 0, 'RIFF');
            view.setUint32(4, chunkSize, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, byteRate, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitsPerSample, true);
            writeString(view, 36, 'data');
            view.setUint32(40, dataSize, true);

            let offset = 44;
            for (let i = 0; i < pcm16.length; i++, offset += 2) {
                view.setInt16(offset, pcm16[i], true);
            }

            return new Blob([buffer], { type: 'audio/wav' });
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        function addMessageToUI(text, sender, imgSrc = null) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            
            if (imgSrc) {
                const img = document.createElement('img');
                img.src = imgSrc;
                msgDiv.appendChild(img);
            }
            
            if (text) {
                const textNode = document.createElement('div');
                textNode.innerHTML = text.replace(/\n/g, '<br>');
                msgDiv.appendChild(textNode);
            }

            if (sender === 'ai' && text) {
                const ttsBtn = document.createElement('button');
                ttsBtn.className = 'tts-btn';
                ttsBtn.innerHTML = `🔊 Dengar Suara`;
                ttsBtn.onclick = () => speakText(text);
                msgDiv.appendChild(ttsBtn);
            }
            
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>
</body>
</html>
